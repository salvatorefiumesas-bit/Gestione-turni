<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3f4f7">
<title>Turni manutenzione stradale</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f3f4f7;--ink:#141821;--mut:#6a7381;--line:#e4e7ec;--soft:#f7f8fa;--amb:#ffb020;--ac:#2563eb;--on:#fff}
*{box-sizing:border-box}
body{margin:0;padding:22px 14px 70px;font:16px/1.5 'Inter','Segoe UI Variable Text','Segoe UI',system-ui,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:860px;margin:auto}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}
.hero{display:flex;align-items:center;gap:16px;margin:6px 2px 26px}
.logo{flex:none;width:56px;height:56px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#ffc94d,var(--amb));box-shadow:0 8px 20px rgba(255,176,32,.35)}
.logo svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.hero h1{margin:0;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.1;font-weight:750;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--mut);max-width:52ch}
.box{background:#fff;border:1px solid var(--line);border-radius:20px;margin-bottom:16px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px rgba(16,24,40,.06)}
.box h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:1.05rem;font-weight:700;color:var(--ink)}
.box h3::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.box label{display:block;margin:10px 0 6px;font-size:.88rem;color:var(--mut);font-weight:600}
input,select{width:100%;margin:0 0 10px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.14);background:#fff}
option{background:#fff;color:var(--ink)}
button{width:100%;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;border:0;border-radius:12px;color:var(--on);background:var(--ac);transition:transform .12s,filter .12s,box-shadow .12s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:none}
.row{display:flex;gap:10px;margin-bottom:10px}.row>*{margin:0}
.f2{flex:2}.f1{flex:1}.gg{width:90px;flex:none}
.row>button{width:auto;flex:none;padding:0 20px}
.btn-danger{width:42px;height:42px;padding:0;flex:none;background:#fff1f0;color:#d92d20}
.btn-danger:hover{background:#d92d20;color:#fff;filter:none;transform:none}
