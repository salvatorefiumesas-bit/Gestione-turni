<style>
:root{--primary:#f39c12;--primary-dark:#d68910;--dark:#2c3e50;--bg:#f8f9fa}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:15px;background:var(--bg);color:#333;max-width:800px;margin:auto}
h1{color:var(--dark);font-size:1.5rem;text-align:center;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.subtitle{text-align:center;color:#7f8c8d;font-size:.9rem;margin-bottom:20px}
.box{background:#fff;padding:18px;margin-bottom:15px;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,.05);border-left:5px solid var(--primary)}
.box h3{margin-top:0;color:var(--dark);font-size:1.1rem}
label{font-size:.9rem;color:#555;display:block;margin-bottom:5px}
input,select{padding:10px;font-size:1rem;margin:5px 0 12px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:6px;background:#fff}
button{background:var(--primary);color:#fff;border:none;padding:12px;font-size:1rem;border-radius:6px;cursor:pointer;font-weight:bold;width:100%;text-transform:uppercase;letter-spacing:.5px}
button:hover{background:var(--primary-dark)}
.btn-danger{background:#e74c3c;width:50px;margin:0;padding:0;height:42px}
.btn-danger:hover{background:#c0392b}
.btn-pdf{background:#27ae60;margin-top:10px}
.employee-row{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.employee-row input{margin:0}
.turno-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f1f1;padding:6px 0}
.turno-row label{font-size:.85rem;font-weight:600;width:50%;margin:0;color:#34495e}
.turno-row select{width:48%;padding:6px;font-size:.85rem;margin:0;border-radius:4px}
.squadra-card-item{display:flex;justify-content:space-between;align-items:center;background:#fdfefe;border:1px solid #eaecee;padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:.9rem}
.festivo-badge{background:#e67e22;color:#fff;padding:4px 10px;border-radius:4px;font-size:.85rem;display:inline-block;margin:3px 3px 3px 0;font-weight:bold}
.vuoto{font-size:.85rem;color:#95a5a6;font-style:italic}
</style>
</head>
